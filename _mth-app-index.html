<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survey Viewer — MT Højgaard</title>
<style>
  :root{
    --navy:#0d3068; --navy-700:#0a2550; --navy-300:#4a6ea8;
    /* Neutrals sit on the logo's hue (217) rather than a neutral grey, so the
       pane reads as the same colour family as the navy rail and the viewer
       chrome instead of a grey slab beside them. Lightness is unchanged. */
    --ink:#12161c; --muted:#59637a; --line:#dee5f0;
    --bg:#f3f6fb; --panel:#fff;
    --rail:56px; --pane:304px; --radius:6px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}   /* must beat author display rules */
  html,body{height:100%}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       color:var(--ink);background:var(--bg);overflow:hidden}

  .shell{display:grid;grid-template-columns:var(--rail) var(--pane) 1fr;height:100vh;height:100dvh;
         transition:grid-template-columns .18s ease}
  .shell.collapsed{grid-template-columns:var(--rail) 0 1fr}

  /* ---------- icon rail ---------- */
  .rail{background:var(--navy);display:flex;flex-direction:column;align-items:center;
        padding:10px 0;gap:4px;overflow:hidden}
  .rail .mark{width:30px;height:30px;margin-bottom:10px;flex:none;
              border-radius:5px;background:#fff;display:grid;place-items:center;
              font:700 11px/1 system-ui;color:var(--navy);letter-spacing:-.02em}
  .tab{width:44px;height:48px;border:0;background:none;color:#a9bcd8;cursor:pointer;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
       border-radius:var(--radius);font:600 9px/1 system-ui;letter-spacing:.03em;
       text-transform:uppercase;transition:.12s;flex:none}
  .tab:hover{background:rgba(255,255,255,.09);color:#fff}
  .tab[aria-selected="true"]{background:rgba(255,255,255,.16);color:#fff}
  .tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
           stroke-linecap:round;stroke-linejoin:round}
  .rail .spacer{flex:1}
  .tog{width:44px;height:48px;border:0;background:none;color:#a9bcd8;cursor:pointer;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
       border-radius:var(--radius);font:600 9px/1 system-ui;letter-spacing:.03em;
       text-transform:uppercase;transition:.12s;flex:none;margin-bottom:6px}
  .tog:hover{background:rgba(255,255,255,.09);color:#fff}
  .tog[aria-pressed="true"]{background:#fff;color:var(--navy)}
  .tog svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;
           stroke-linecap:round;stroke-linejoin:round}

  /* ---------- pane ---------- */
  .pane{background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .pane-head{padding:14px 18px 12px;border-bottom:1px solid var(--line);flex:none;
             display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pane-head img{height:22px;width:auto;display:block}
  .pane-head .ttl{font:700 11px/1 system-ui;letter-spacing:.09em;text-transform:uppercase;
                  color:var(--muted);white-space:nowrap}
  .scroll{overflow-y:auto;flex:1;min-height:0;padding:16px 18px}
  .view{display:none}
  .view.on{display:block}
  h2{margin:0 0 9px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
     color:var(--muted);font-weight:700}
  h2:not(:first-child){margin-top:22px}

  .proj{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;
        border:1px solid var(--line);border-radius:var(--radius);background:#fff;
        cursor:pointer;font:inherit;transition:.12s}
  .proj:hover{border-color:var(--navy-300);background:#f9fbfd}
  .proj[aria-current="true"]{border-color:var(--navy);background:#f2f6fc;
        box-shadow:inset 3px 0 0 var(--navy)}
  .proj .n{font-weight:600}
  .proj .l{font-size:12px;color:var(--muted);margin-top:2px}

  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
  dt{color:var(--muted)}
  dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  .crs{grid-column:1/-1;text-align:left;font-size:12px;background:var(--bg);
       border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin-top:4px}
  .crs b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
         color:var(--muted);margin-bottom:2px;font-weight:700}

  .ramp{height:12px;border-radius:3px;margin-bottom:5px;
        background:linear-gradient(90deg,#440154,#414487,#2a788e,#22a884,#7ad151,#fde725)}
  .ramp-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
            font-variant-numeric:tabular-nums}

  .row{display:flex;gap:6px;flex-wrap:wrap}
  button.act{flex:1 1 auto;padding:8px 10px;border:1px solid var(--line);background:#fff;
             border-radius:var(--radius);cursor:pointer;font:inherit;font-size:13px;
             color:var(--ink);transition:.12s;white-space:nowrap}
  button.act:hover{border-color:var(--navy-300);background:#f9fbfd}
  button.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  button.primary:hover{background:var(--navy-700);border-color:var(--navy-700)}

  .lyr{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px}
  .lyr input{accent-color:var(--navy);width:15px;height:15px;cursor:pointer}
  .lyr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .dl{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;
      border:1px solid var(--line);border-radius:var(--radius);margin-bottom:6px;
      font-size:13px;text-decoration:none;color:var(--ink)}
  .dl:hover{border-color:var(--navy-300);background:#f9fbfd}
  .dl .s{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

  .drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:18px 14px;
        text-align:center;color:var(--muted);font-size:13px}
  .hint{color:var(--muted);font-size:13px}

  footer{padding:11px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);flex:none}
  .mode{display:inline-block;padding:1px 6px;border-radius:3px;background:var(--bg);
        border:1px solid var(--line);font-size:10px;letter-spacing:.05em}

  /* ---------- map ---------- */
  main{position:relative;background:#eef1f4;min-width:0}
  iframe{width:100%;height:100%;border:0;display:block}
  .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
         padding:40px;color:var(--muted);background:#eef1f4}
  .empty h3{margin:0 0 6px;font-size:16px;color:var(--ink);font-weight:600}
  .empty p{margin:0;font-size:13px;max-width:30ch}
  .toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
         background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;
         font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
  .toast.on{opacity:.94}

  .pane-x{display:none;width:34px;height:34px;flex:none;border:0;background:none;padding:0;
          color:var(--muted);cursor:pointer;border-radius:var(--radius)}
  .pane-x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;
              stroke-linecap:round}
  .pane-x:hover{background:var(--bg);color:var(--ink)}

  /* ---------- small screens ----------
     The rail becomes a bottom tab bar (thumb reach) and the pane a bottom sheet
     over the map, rather than a 304px column beside a 56px rail — which on a
     360px phone left almost no map. Heights use dvh so the sheet is not cut off
     by mobile browser chrome, and safe-area insets keep the bar clear of the
     home indicator.                                                          */
  @media (max-width:820px){
    :root{--railh:58px}

    .shell,.shell.collapsed{grid-template-columns:1fr;grid-template-rows:1fr auto}
    main{grid-row:1;grid-column:1}

    .rail{grid-row:2;grid-column:1;flex-direction:row;justify-content:space-evenly;
          align-items:center;height:var(--railh);padding:0 4px;
          padding-bottom:env(safe-area-inset-bottom);gap:2px}
    .rail .mark,.rail .spacer{display:none}
    .tab{flex:1 1 0;width:auto;min-width:0;height:48px;gap:4px}
    .tab svg{width:20px;height:20px}

    .pane{position:fixed;left:0;right:0;top:auto;
          bottom:calc(var(--railh) + env(safe-area-inset-bottom));
          width:auto;max-height:70dvh;z-index:6;
          border-right:0;border-top:1px solid var(--line);
          border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.20)}
    .shell.collapsed .pane{display:none}

    /* Grab handle: signals the sheet is dismissable. Tapping the active tab
       also closes it, but nobody discovers that on their own. */
    .pane-head{position:relative;padding-top:20px}
    .pane-head::before{content:"";position:absolute;top:8px;left:50%;
                       transform:translateX(-50%);width:34px;height:4px;
                       border-radius:2px;background:var(--line)}
    .pane-x{display:grid;place-items:center}

    footer{display:none}
    .toast{bottom:16px}
  }

  /* Coarse pointers: the 44px minimum touch target, on any screen size. */
  @media (pointer:coarse){
    .proj{padding:13px 12px}
    button.act{padding:11px 12px}
    .dl{padding:11px 10px}
    .lyr{padding:9px 0}
    .lyr input{width:18px;height:18px}
  }
</style>
</head>
<body>
<div class="shell" id="shell">

  <nav class="rail" role="tablist" aria-label="Sections">
    <div class="mark">MTH</div>
    <button class="tab" role="tab" data-view="projects" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>Projects</button>
    <button class="tab" role="tab" data-view="details" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Details</button>
    <button class="tab" role="tab" data-view="upload" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 16v3h16v-3"/></svg>Upload</button>
    <div class="spacer"></div>
  </nav>

  <div class="pane">
    <div class="pane-head">
      <span class="ttl" id="pane-title">Projects</span>
      <button class="pane-x" id="panex" type="button" aria-label="Close panel">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <div class="scroll">
      <div class="view on" id="v-projects">
        <div id="projects"></div>
      </div>

      <div class="view" id="v-details">
        <div id="details-body"><p class="hint">Choose a project to see its details.</p></div>
        <h2>Views</h2>
        <div class="row" id="views"><p class="hint">—</p></div>
        <h2>Actions</h2>
        <div class="row">
          <button class="act primary" id="share">Copy share link</button>
          <button class="act" id="snap">Snapshot</button>
        </div>
      </div>

      <div class="view" id="v-upload">
        <h2>Upload survey data</h2>
        <div class="drop">Coming next — orthophotos convert automatically,<br>point clouds queue for processing.</div>
      </div>
    </div>

    <footer>Internal demo · <span class="mode" id="mode">connecting…</span></footer>
  </div>

  <main>
    <iframe id="map" title="Map viewer" allow="fullscreen" hidden></iframe>
    <div class="empty" id="empty">
      <div>
        <h3>No project selected</h3>
        <p>Pick a survey from the Projects tab to load it.</p>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </main>
</div>

<script type="module">
const VIEWER_PARAMS = "panels=collapsed&theme=light&welcome=0";
const BRAND_LOGO = "/viewer/mth_logo.png";
let cfg=null, current=null, api=null, activeView="projects";

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const fmt = n => n.toLocaleString("en-GB");

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2200);}

const viewerUrl = p =>
  `${cfg.viewerOrigin}/?url=${encodeURIComponent(p.projectUrl)}&${VIEWER_PARAMS}`;

/* ---------- tabs ---------- */
function showView(name){
  const shell=$("#shell");
  if(name===activeView && !shell.classList.contains("collapsed")){
    shell.classList.add("collapsed"); return;           // click active tab = collapse
  }
  shell.classList.remove("collapsed");
  activeView=name;
  $$(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.view===name)));
  $$(".view").forEach(v=>v.classList.toggle("on",v.id===`v-${name}`));
  $("#pane-title").textContent={projects:"Projects",details:"Details",upload:"Upload"}[name]||name;
}
$$(".tab").forEach(t=>t.onclick=()=>showView(t.dataset.view));
$("#panex").onclick=()=>$("#shell").classList.add("collapsed");
/* On a phone the pane is a sheet over the map, so open onto the map and let
   the user raise the sheet. On desktop it is a column beside the map and
   costs nothing, so it stays open. */
if(window.matchMedia("(max-width:820px)").matches) $("#shell").classList.add("collapsed");

/* ---------- rendering ---------- */
function renderProjects(){
  const box=$("#projects"); box.innerHTML="";
  cfg.projects.forEach(p=>{
    const b=document.createElement("button");
    b.className="proj"; b.setAttribute("aria-current",String(p.id===current?.id));
    b.innerHTML=`<div class="n"></div><div class="l"></div>`;
    b.querySelector(".n").textContent=p.name;
    b.querySelector(".l").textContent=p.location||"";
    b.onclick=()=>select(p.id,true);
    box.appendChild(b);
  });
}

function renderDetails(p){
  const box=$("#details-body");
  if(!p){box.innerHTML=`<p class="hint">Choose a project to see its details.</p>`;return;}
  const area=p.extentM?(p.extentM[0]*p.extentM[1]/10000):null;
  const rows=[["Flown",p.flown],["Sensor",p.surveyor],["Job no.",p.jobNumber],
    ["Points",p.pointCount?fmt(p.pointCount):null],
    ["Extent",p.extentM?`${p.extentM[0].toFixed(0)} × ${p.extentM[1].toFixed(0)} m`:null],
    ["Area",area?`${area.toFixed(1)} ha`:null],
    ["Density",p.density?`${fmt(p.density)} pts/m²`:null]].filter(r=>r[1]);

  let html=`<h2>Survey</h2><dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}`;
  if(p.crs) html+=`<div class="crs"><b>Coordinate reference system</b>${p.crs}${p.epsg?` · ${p.epsg}`:""}</div>`;
  html+=`</dl>`;
  if(p.elevationRange){
    html+=`<h2>Elevation</h2><div class="ramp"></div><div class="ramp-lbl">
      <span>${p.elevationRange[0].toFixed(1)}</span><span>m, DVR90</span>
      <span>${p.elevationRange[1].toFixed(1)}</span></div>`;
  }
  if((p.downloads||[]).length){
    html+=`<h2>Downloads</h2>`+p.downloads.map(d=>
      `<a class="dl" href="${d.url}" target="_blank" rel="noopener">
         <span>${d.label}</span><span class="s">${d.size||""}</span></a>`).join("");
  }
  box.innerHTML=html;
}

function renderViews(p){
  const box=$("#views"); box.innerHTML="";
  const views=(p&&p.views)||[];
  if(!views.length){box.innerHTML=`<p class="hint">—</p>`;return;}
  views.forEach(v=>{
    const b=document.createElement("button"); b.className="act"; b.textContent=v.label;
    b.onclick=async()=>{
      if(!api) return toast("Views need the live connection");
      try{ await api.setView({center:v.center,zoom:v.zoom,pitch:v.pitch??0,bearing:v.bearing??0}); }
      catch{ toast("Could not move the camera"); }
    };
    box.appendChild(b);
  });
}

/* The layer list lived here. GeoLibre's own LAYERS rail does the same job
   inside the viewer, with styling and ordering this list never had, so the
   duplicate is gone rather than fixed.                                     */

/* ---------- selection ---------- */
async function select(id,push){
  const p=cfg.projects.find(x=>x.id===id); if(!p) return;
  const firstLoad=!current;
  current=p;
  renderProjects(); renderDetails(p); renderViews(p);
  document.title=`${p.name} — MT Højgaard`;
  if(push) history.replaceState(null,"",`?project=${encodeURIComponent(p.id)}`);

  $("#empty").hidden=true; $("#map").hidden=false;

  if(api && !firstLoad){
    try{ await api.loadProject(p.projectUrl); showView("details"); return; }
    catch{}
  }
  $("#map").src=viewerUrl(p);
  showView("details");
}

/* ---------- actions ---------- */
$("#share").onclick=async()=>{
  if(!current) return toast("No project selected");
  const link=`${location.origin}${location.pathname}?project=${encodeURIComponent(current.id)}`;
  try{ await navigator.clipboard.writeText(link); toast("Share link copied"); }
  catch{ prompt("Copy this link:",link); }
};
$("#snap").onclick=async()=>{
  if(!api) return toast("Snapshot needs the live connection");
  try{
    const d=await api.exportImage(); const a=document.createElement("a");
    a.href=d; a.download=`${current.id}-${new Date().toISOString().slice(0,10)}.png`;
    a.click(); toast("Snapshot saved");
  }catch{ toast("Snapshot unavailable"); }
};

/* ---------- rebrand inside the viewer (same origin) ---------- */
function rebrandViewer(){
  try{
    const doc=$("#map").contentDocument; if(!doc||!doc.body) return false;
    if(!doc.getElementById("mth-brand-css")){
      const st=doc.createElement("style"); st.id="mth-brand-css";
      st.textContent=`.mth-brand{display:inline-flex;align-items:center;height:100%}
                      .mth-brand img{height:17px;width:auto;display:block}`;
      doc.head.appendChild(st);
    }
    const hit=[...doc.querySelectorAll("a,button,div,span,h1")].find(el=>
      el.children.length<=2 && /^\s*GeoLibre\s*$/i.test(el.textContent||""));
    if(!hit) return false;
    const t=hit.closest("a,button")||hit;
    if(t.dataset.mthBranded) return true;
    t.dataset.mthBranded="1"; t.setAttribute("title","MT Højgaard Survey Viewer");
    t.innerHTML=`<span class="mth-brand"><img src="${BRAND_LOGO}" alt="MT Højgaard"></span>`;
    return true;
  }catch{ return false; }
}
/* The LiDAR panel is toggled inside the viewer now: the fork keeps the
   control's own button on the map (eye icon, beside the other map controls)
   and the panel starts collapsed. Nothing here reaches into the iframe for
   it — window.geolibreLidarPanel(open) stays available on the viewer window
   if this page ever needs to drive it again.                               */

function watchAndRebrand(){let n=0;const t=setInterval(()=>{if(rebrandViewer()||++n>40)clearInterval(t);},250);}
async function ensureApi(){
  if(api) return;
  try{
    const mod=await import("https://cdn.jsdelivr.net/npm/@geolibre/embed/+esm");
    api=await mod.connect($("#map"),{origin:cfg.viewerOrigin,timeoutMs:20000});
    $("#mode").textContent="live"; $("#mode").style.color="var(--navy)";
    api.on?.("projectLoaded",()=>{ watchAndRebrand(); });
  }catch{
    api=null; $("#mode").textContent="basic";
    $("#mode").title="Embed API unavailable — switching projects reloads the map";
  }
}
$("#map").addEventListener("load",async()=>{
  watchAndRebrand();
  await ensureApi();
});

/* ---------- boot ---------- */
(async function(){
  cfg=await (await fetch("projects.json",{cache:"no-store"})).json();
  renderProjects();
  $("#mode").textContent="idle";

  const wanted=new URLSearchParams(location.search).get("project");
  if(wanted && cfg.projects.some(p=>p.id===wanted)) select(wanted,false);
})();
</script>
</body>
</html>
