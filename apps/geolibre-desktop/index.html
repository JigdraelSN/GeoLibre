<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- MTH: gis.mth.site's bare root normally shows the raw (empty) GeoLibre
         shell -- nobody visits it with no query string on purpose; the branded
         portal wrapper at /app/ is what "the site"/"the portal" means to MTH
         and its colleagues. Every legitimate direct load of the raw app
         carries a query string (a shared project link, a Whitebox tool deep
         link, the portal's own map iframe, which always passes ?url=...), so
         this only ever fires on a truly bare load. Hostname-gated so it's a
         no-op for local dev, the desktop/Tauri build, the Jupyter embed, and
         any other deployment of this fork -- see project.ts's
         isHiddenByDefaultCadLayerName for the same "MTH-only, safe everywhere
         else" pattern. -->
    <script>
      (function () {
        try {
          if (
            window.location.hostname === "gis.mth.site" &&
            window.location.pathname === "/" &&
            window.location.search === "" &&
            window.location.hash === "" &&
            window.top === window.self
          ) {
            window.location.replace("/app/");
          }
        } catch (e) {
          /* never block the app load over this */
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" sizes="32x32" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!-- viewport-fit=cover lets the page extend under the mobile status/nav bars
         and display cutouts so env(safe-area-inset-*) report their sizes; the app
         shell then pads itself by those insets (see #root in src/index.css). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A free and open-source, lightweight, cloud-native GIS platform for visualizing, exploring, and analyzing geospatial data, running in the browser, on the desktop, on mobile, and inside Jupyter notebooks while keeping your data local and private."
    />
    <meta name="theme-color" content="#2f8f85" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Apple-prefixed variant kept for older iOS Safari (pre-17.4) home-screen
         standalone mode; the standard tag above is what newer browsers expect. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GeoLibre" />
    <title>GeoLibre</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="%BASE_URL%geolibre-runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
